<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students List - Student Management System</title>
    <!-- Relative paths to global stylesheets -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>

    <div class="app-container">
        
        <!-- 1. SIDEBAR NAVIGATION -->
        <aside class="sidebar" id="app-sidebar">
            <div class="sidebar-brand">
                <svg class="svg-icon" viewBox="0 0 24 24" style="color: var(--primary);">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>EduPortal</span>
            </div>
            
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="./dashboard.html">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="7" height="9"></rect>
                            <rect x="14" y="3" width="7" height="5"></rect>
                            <rect x="14" y="12" width="7" height="9"></rect>
                            <rect x="3" y="16" width="7" height="5"></rect>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-item active">
                    <a href="./students.html">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>Students List</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="./add-student.html">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                        <span>Add Student</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="./attendance.html">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span>Attendance</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="./results.html">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <span>Results</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="./profile.html">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            <path d="M2 12h20"></path>
                        </svg>
                        <span>Profile Settings</span>
                    </a>
                </li>
            </ul>
            
            <div class="sidebar-footer">
                <button type="button" class="btn btn-logout" id="logout-btn">
                    <svg class="svg-icon" viewBox="0 0 24 24" style="width:16px; height:16px;">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- 2. MAIN CONTENT AREA -->
        <main class="main-content">
            
            <header class="main-header">
                <div class="header-title-area">
                    <button class="menu-toggle" id="menu-toggle-btn" aria-label="Toggle Navigation">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="width:24px; height:24px;">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h2>Students List</h2>
                </div>
                
                <div class="user-profile-badge">
                    <div class="user-info">
                        <div class="user-name" id="display-user-email">admin@gmail.com</div>
                        <div class="user-role">Academic Administrator</div>
                    </div>
                    <div class="avatar-circle" id="user-avatar">A</div>
                </div>
            </header>
            
            <!-- Dashboard scroll body -->
            <div class="dashboard-body">
                
                <!-- Filter Controls Panel -->
                <section class="table-controls">
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="search-input" 
                            class="form-control" 
                            placeholder="Search by student name or roll number..."
                        >
                    </div>
                    
                    <div class="filter-box">
                        <select id="branch-filter" class="form-control">
                            <option value="all">All Branches</option>
                            <!-- Remaining options will render dynamically from database -->
                        </select>
                    </div>
                    
                    <a href="./add-student.html" class="btn btn-primary">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add Student
                    </a>
                </section>
                
                <!-- Toast alert notification slot -->
                <div id="toast-notification" class="alert alert-success" style="display: none; margin-bottom: 1.5rem;">
                    <span id="toast-text">Success Message!</span>
                </div>

                <!-- Students Directory Table Card -->
                <section class="card">
                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Roll No</th>
                                    <th>Student Name</th>
                                    <th>Branch/Course</th>
                                    <th>Phone Contact</th>
                                    <th class="text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="students-table-body">
                                <tr>
                                    <td colspan="5" class="text-center" style="color: var(--text-muted); padding: 3rem;">
                                        Loading records...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
                
            </div>
            
        </main>
        
    </div>

    <!-- Script references -->
    <script src="./js/validation.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/students.js"></script>
</body>
</html>

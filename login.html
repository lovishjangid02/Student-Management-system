<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <!-- Relative stylesheet path -->
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* Specific page wrapper to center-align the login card */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at 10% 20%, hsl(210, 40%, 96%) 0%, hsl(214, 32%, 91%) 90%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-light);
            padding: 12px;
            border-radius: var(--radius-sm);
        }

        .login-header h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .login-header p {
            font-size: 0.875rem;
        }

        /* Demo credentials helper panel */
        .credentials-helper {
            background-color: var(--primary-light);
            border: 1px dashed var(--border-focus);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: left;
        }

        .credentials-helper strong {
            color: var(--primary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .svg-icon {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <div class="login-logo">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to access your administrative panel</p>
            </div>

            <!-- Error alert box (hidden by default) -->
            <div id="login-alert" class="alert alert-danger" style="display: none;">
                <span id="alert-text">Invalid credentials. Please try again.</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" novalidate>
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="e.g., admin@gmail.com" 
                        autocomplete="email"
                        required
                    >
                    <div class="invalid-feedback">A valid email address is required.</div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="••••••••" 
                        autocomplete="current-password"
                        required
                    >
                    <div class="invalid-feedback">Password is required (min 6 characters).</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Sign In
                </button>
            </form>

            <!-- Offline Credentials Helper Box -->
            <div class="credentials-helper">
                💡 <strong>Credentials Info:</strong><br>
                • Use any valid <strong>Gmail/Email</strong> address.<br>
                • Password must be at least <strong>6 characters</strong>.
            </div>

        </div>
    </div>

    <!-- Relative paths for JavaScript validation & auth controllers -->
    <script src="./js/validation.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
